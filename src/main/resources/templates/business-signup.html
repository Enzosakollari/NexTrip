<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; background:#0b1324; }

    .video-background { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
    .video-background video { width:100%; height:100%; object-fit:cover; object-position:center; transform:scale(1.05); filter:brightness(0.8); }
    .video-overlay { position:absolute; top:0; left:0; width:100%; height:100%;
      background: linear-gradient(135deg, rgba(11,19,36,0.85) 0%, rgba(22,43,107,0.65) 50%, rgba(11,19,36,0.85) 100%);
      animation: none;
    }

    @keyframes overlayShift {
      0% { background-position: center, 0 0; }
      50% { background-position: center, 200px -120px; }
      100% { background-position: center, 0 0; }
    }

    .container { width:100%; max-width:460px; padding:20px; z-index:1; opacity:0; animation:fadeIn 1.2s ease-out forwards; animation-delay:.2s; }
    .window {
      background: rgba(20, 25, 35, 0.92);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100,150,255,0.25);
      transform: translateY(20px);
      opacity: 0;
      animation: fadeInUp .8s ease-out forwards;
      animation-delay: .4s;
    }

    h2 { color:#fff; text-align:center; margin-bottom:10px; font-weight:600; font-size:28px; opacity:0; animation:fadeIn .8s ease-out forwards; animation-delay:.6s; }
    .sub { text-align:center; color: rgba(255,255,255,0.7); margin-bottom:18px; font-size: 14px; opacity:0; animation:fadeIn .8s ease-out forwards; animation-delay:.7s; }

    .input-group { margin-bottom: 14px; }
    label { display:block; margin-bottom:6px; color: rgba(255,255,255,0.7); font-size: 13px; }

    input {
      width:100%;
      padding:14px 16px;
      background: rgba(30,35,45,0.95);
      border:1px solid rgba(100,150,255,0.3);
      border-radius:10px;
      color:#fff;
      font-size:15px;
      transition:all .3s ease;
    }
    input:focus { outline:none; border-color:#4a90e2; box-shadow:0 0 0 3px rgba(74,144,226,0.3); }

    .btn {
      width:100%;
      padding: 14px 16px;
      background: linear-gradient(135deg, #4a90e2, #357abd);
      border:none;
      border-radius:10px;
      color:#fff;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition: all .3s ease;
      margin-top: 8px;
      box-shadow: 0 5px 15px rgba(74,144,226,0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,144,226,0.6); }

    .notice { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,0.7); text-align:center; }
    .notice a { color:#4a90e2; text-decoration:none; }
    .notice a:hover { text-decoration: underline; color:#6ba8ff; }

    .alert { padding: 10px; border-radius: 8px; margin-bottom: 14px; text-align:center; display:none; }
    .alert.ok { background-color: rgba(16,185,129,0.2); color:#10b981; }
    .alert.err { background-color: rgba(239,68,68,0.2); color:#ef4444; }

    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

    @media (max-width: 480px) {
      .container { padding: 15px; }
      .window { padding: 24px 18px; }
    }
  </style>
</head>
<body>
<div class="video-background">
  <video autoplay muted loop id="bg-video">
    <source src="/videos/plane.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="video-overlay"></div>
</div>

<div class="container">
  <div class="window">
    <h2>Business Sign Up</h2>
    <div class="sub">Create your business account and publish travel packs</div>

    <div id="ok" class="alert ok"></div>
    <div id="err" class="alert err"></div>

    <form id="businessForm">
      <div class="input-group">
        <label>Company name</label>
        <input name="companyName" placeholder="Your company name" required>
      </div>

      <div class="input-group">
        <label>Contact email</label>
        <input name="contactEmail" type="email" placeholder="contact@company.com" required>
      </div>

      <div class="input-group">
        <label>Business username</label>
        <input name="username" placeholder="Choose a username" required>
      </div>

      <div class="input-group">
        <label>Login email</label>
        <input name="email" type="email" placeholder="login@company.com" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input name="password" type="password" placeholder="Create a password" required>
      </div>

      <button class="btn" type="submit">Create business account</button>
    </form>

    <div class="notice">
      Already have a business account? <a href="/business/login">Login</a>
    </div>
    <div class="notice">
      Are you a traveler? <a href="/signup">Go to traveler signup</a>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('businessForm');
  const ok = document.getElementById('ok');
  const err = document.getElementById('err');

  function show(el, msg) {
    el.style.display = 'block';
    el.textContent = msg;
  }
  function hide(el) {
    el.style.display = 'none';
    el.textContent = '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hide(ok); hide(err);

    const data = Object.fromEntries(new FormData(form).entries());

    try {
      const res = await fetch('/req/business/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const txt = await res.text();

      if (res.ok) {
        show(ok, 'Created. Check your email to verify your business account.');
        form.reset();
      } else {
        show(err, txt || 'Signup failed.');
      }
    } catch (e2) {
      show(err, 'Network error. Try again.');
    }
  });
</script>
<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>
</body>
</html>
