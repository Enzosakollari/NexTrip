<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business AI Chat - NextTrip</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <div th:replace="~{fragments/business-navbar :: businessNavbarStyles}"></div>
</head>
<body>

<div th:replace="~{fragments/business-navbar :: businessNav('ai')}"></div>

<main class="page">
    <section class="section">
        <div class="container" style="max-width: 900px;">

            <h1>AI Assistant</h1>
            <p class="muted">Ask AI for travel pack ideas, descriptions, pricing, or marketing text.</p>

            <form th:action="@{/business/ai}" method="post"
                  style="display:flex; gap:10px; margin-top:16px;">

                <input class="input"
                       name="message"
                       placeholder="Ask something..."
                       required
                       style="flex:1;">

                <button class="btn btn--primary" type="submit">Send</button>
            </form>

            <!-- AI RESPONSE -->
            <div th:if="${reply != null}"
                 class="card card__pad"
                 style="margin-top:16px;">
                <div class="muted">AI Response</div>
                <div th:text="${reply}"></div>
            </div>

        </div>
    </section>
</main>

<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>
</body>
</html>
