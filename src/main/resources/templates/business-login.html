<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; background:#0b1324; }

        .video-background { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
        .video-background video { width:100%; height:100%; object-fit:cover; object-position:center; transform:scale(1.05); filter:brightness(0.8); }
        .video-overlay { position:absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, rgba(11,19,36,0.85) 0%, rgba(22,43,107,0.65) 50%, rgba(11,19,36,0.85) 100%);
            animation: none;
        }

        @keyframes overlayShift {
            0% { background-position: center, 0 0; }
            50% { background-position: center, 200px -120px; }
            100% { background-position: center, 0 0; }
        }

        .container { width:100%; max-width:420px; padding:20px; z-index:1; opacity:0; animation:fadeIn 1.2s ease-out forwards; animation-delay:.3s; }
        .window {
            background: rgba(20, 25, 35, 0.92);
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100,150,255,0.25);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp .8s ease-out forwards;
            animation-delay: .5s;
        }

        h2 { color:#fff; text-align:center; margin-bottom:10px; font-weight:600; font-size:30px; opacity:0; animation:fadeIn .8s ease-out forwards; animation-delay:.7s; }
        .sub { text-align:center; color: rgba(255,255,255,0.7); margin-bottom:22px; font-size: 14px; opacity:0; animation:fadeIn .8s ease-out forwards; animation-delay:.8s; }

        .logo { text-align:center; margin-bottom: 18px; opacity:0; animation:fadeIn .8s ease-out forwards; animation-delay:.5s; }
        .logo img { width:80px; height:80px; border-radius:50%; object-fit:cover; box-shadow:0 5px 15px rgba(0,0,0,0.3); background: rgba(30,35,45,0.7); padding:5px; }

        .input-group { margin-bottom: 18px; opacity:0; animation:fadeIn .8s ease-out forwards; }
        .input-group:nth-child(1) { animation-delay: .9s; }
        .input-group:nth-child(2) { animation-delay: 1.1s; }

        input {
            width:100%;
            padding:16px 20px;
            background: rgba(30,35,45,0.95);
            border:1px solid rgba(100,150,255,0.3);
            border-radius:10px;
            color:#fff;
            font-size:16px;
            transition:all .3s ease;
        }
        input:focus { outline:none; border-color:#4a90e2; box-shadow:0 0 0 3px rgba(74,144,226,0.3); transform: translateY(-2px); }
        input::placeholder { color: rgba(255,255,255,0.6); }

        .btn {
            width:100%;
            padding:16px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            border:none;
            border-radius:10px;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition: all .3s ease;
            margin-top: 6px;
            opacity:0;
            animation:fadeIn .8s ease-out forwards;
            animation-delay: 1.3s;
            box-shadow: 0 5px 15px rgba(74,144,226,0.4);
        }
        .btn:hover { background: linear-gradient(135deg, #3a80d2, #2a6aad); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(74,144,226,0.6); }

        .switch { text-align:center; margin-top:18px; color: rgba(255,255,255,0.7); opacity:0; animation:fadeIn .8s ease-out forwards; animation-delay: 1.5s; }
        .switch a { color:#4a90e2; text-decoration:none; font-weight:500; }
        .switch a:hover { text-decoration:underline; color:#6ba8ff; }

        .pill-row { margin-top: 14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .pill {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(100,150,255,0.25);
            color: rgba(255,255,255,0.85);
            font-size: 12px;
        }

        .video-controls { position:fixed; bottom:20px; right:20px; z-index:2; opacity:0; animation:fadeIn 1s ease-out forwards; animation-delay:2s; }
        .video-controls button {
            background: rgba(20,25,35,0.8);
            border: 1px solid rgba(100,150,255,0.3);
            color: #4a90e2;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .3s ease;
            backdrop-filter: blur(5px);
        }
        .video-controls button:hover { background: rgba(30,35,45,0.9); transform: translateY(-2px); }

        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        @keyframes fadeInUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            .window { padding: 25px 20px; }
            h2 { font-size: 26px; }
            .video-controls { bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>
<div class="video-background">
    <video autoplay muted loop id="bg-video">
        <source src="/videos/plane.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>
</div>

<div class="container">
    <div class="window">
        <div class="logo">
            <img src="/images/logo.png" alt="Logo">
        </div>

        <h2>Business Login</h2>
        <div class="sub">Manage travel packs and your business profile</div>

        <div th:if="${message}" style="background-color: rgba(16,185,129,0.2); color:#10b981; padding:10px; border-radius:8px; margin-bottom:18px; text-align:center;" th:text="${message}"></div>
        <div th:if="${error}" style="background-color: rgba(239,68,68,0.2); color:#ef4444; padding:10px; border-radius:8px; margin-bottom:18px; text-align:center;" th:text="${error}"></div>

        <form method="post" action="/business/perform_login">
            <div class="input-group">
                <input type="text" name="username" placeholder="Business username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="pill-row">
            <div class="pill">Separate business access</div>
            <div class="pill">Email verification</div>
            <div class="pill">Secure login</div>
        </div>

        <p class="switch">Don’t have a business account? <a href="/business/signup">Sign up</a></p>
        <p class="switch">Are you a traveler? <a href="/login">Go to traveler login</a></p>
    </div>
</div>

<div class="video-controls">
    <button id="video-toggle"><i class="fas fa-pause"></i> Pause Video</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('bg-video');
        const videoToggle = document.getElementById('video-toggle');

        videoToggle.addEventListener('click', function() {
            if (video.paused) {
                video.play();
                videoToggle.innerHTML = '<i class="fas fa-pause"></i> Pause Video';
            } else {
                video.pause();
                videoToggle.innerHTML = '<i class="fas fa-play"></i> Play Video';
            }
        });

        const logoImg = document.querySelector('.logo img');
        logoImg.addEventListener('error', function() {
            const logoDiv = document.querySelector('.logo');
            logoDiv.innerHTML = '<i class="fas fa-briefcase"></i>';
            logoDiv.style.fontSize = '40px';
            logoDiv.style.color = '#4a90e2';
        });
    });
</script>
<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>
</body>
</html>
