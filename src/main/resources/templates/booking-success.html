<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Successful</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .success-wrap {
            max-width: 760px;
            margin: 80px auto;
            text-align: center;
        }
        .success-card {
            padding: 34px 30px;
            position: relative;
            overflow: hidden;
        }
        .success-card::before {
            content: "";
            position: absolute;
            inset: -40% -10% auto auto;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2), transparent 70%);
        }
        .success-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            font-size: 60px;
            box-shadow: 0 20px 50px rgba(16, 185, 129, 0.2);
            animation: pop 420ms ease-out;
        }
        .success-actions {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        @keyframes pop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="success-wrap card success-card">
    <div class="success-icon">✓</div>
    <h1>Payment confirmed</h1>
    <p class="muted">Your booking is locked in. Your ticket is on its way to your email.</p>

    <div class="success-actions">
        <a href="/my-bookings" class="btn btn--primary">My Bookings</a>
        <a href="/my-tickets" class="btn btn--ghost">My Tickets</a>
        <a href="/travel-packs" class="btn btn--ghost">Explore more</a>
    </div>
</div>

<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>
</body>
</html>
