<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Packs • NextTrip</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
    <div class="container topbar__inner">
        <a href="/index" class="brand">
            <span class="brand__mark">NT</span>
            <span class="brand__name">NextTrip</span>
        </a>

        <nav class="nav">
            <a href="/index" class="nav__link">Explore</a>
            <a href="/flights/search-view" class="nav__link">Flight Search</a>
            <a href="/travel-packs" class="nav__link nav__link--active">Travel Packs</a>
            <a href="/chat" class="nav__link">AI Chat</a>
        </nav>

        <div class="topbar__actions">
            <a class="btn btn--ghost" href="/login">Login</a>
            <a class="btn btn--primary" href="/index">Home</a>
        </div>
    </div>
</header>

<main class="page">
    <section class="section">
        <div class="container">
            <div class="section__head section__head--row">
                <div>
                    <h2>Travel Packs</h2>
                    <p class="muted">Packages created by businesses (demo MVP).</p>
                </div>
            </div>

            <div class="packs" th:if="${!#lists.isEmpty(packs)}">
                <a class="pack card" th:each="p : ${packs}" th:href="@{'/travel-packs/' + ${p.id}}">
                    <div class="pack__media">
                        <div class="pack__place" th:text="${p.destination}">Destination</div>
                    </div>

                    <div class="pack__body">
                        <div class="pack__title" th:text="${p.title}">Title</div>
                        <div class="muted pack__meta" th:text="${p.durationDays + ' days • ' + p.currency + ' ' + p.price}">meta</div>

                        <div class="pack__foot">
                            <div class="price" th:text="${p.currency + ' ' + p.price}">€</div>
                            <span class="btn btn--small">View</span>
                        </div>
                    </div>
                </a>
            </div>

            <div th:if="${#lists.isEmpty(packs)}" class="card card__pad">
                No packages yet. Ask a business to create one.
            </div>
        </div>
    </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
