<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - NextTrip Business</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <div th:replace="~{fragments/business-navbar :: businessNavbarStyles}"></div>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --dark: #0f172a;
            --light: #f8fafc;
            --white: #ffffff;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--dark);
            background: var(--light);
            line-height: 1.6;
        }

        .page {
            padding: 2rem 0;
            min-height: calc(100vh - 80px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .page-header {
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p {
            color: var(--gray);
            font-size: 1.125rem;
        }

        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
        }

        .booking-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 2px solid var(--gray-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .booking-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .booking-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .booking-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-light);
        }

        .booking-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: var(--dark);
        }

        .booking-customer {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .customer-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.125rem;
        }

        .customer-info strong {
            font-weight: 700;
            color: var(--dark);
            display: block;
        }

        .customer-info span {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .booking-details {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: var(--light);
            border-radius: 10px;
        }

        .detail-item strong {
            font-weight: 600;
            color: var(--gray);
        }

        .detail-item span {
            font-weight: 700;
            color: var(--dark);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge--pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-badge--confirmed {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge--cancelled {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .booking-form {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        .input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--gray-light);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .btn--primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .empty-state {
            background: white;
            border-radius: 24px;
            padding: 4rem 2rem;
            text-align: center;
            border: 2px dashed var(--gray-light);
        }

        .empty-state__icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .empty-state p {
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .bookings-grid {
                grid-template-columns: 1fr;
            }

            .booking-form {
                flex-direction: column;
                align-items: stretch;
            }

            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<div th:replace="fragments/business-navbar :: businessNav('bookings')"></div>

<main class="page">
    <div class="container">
        <div class="page-header">
            <h1>Bookings</h1>
            <p>Manage all package bookings from customers</p>
        </div>

        <div th:if="${#lists.isEmpty(bookings)}" class="empty-state">
            <div class="empty-state__icon">📋</div>
            <h2>No bookings yet</h2>
            <p>Bookings from customers will appear here</p>
        </div>

        <div class="bookings-grid" th:if="${!#lists.isEmpty(bookings)}">
            <div class="booking-card" th:each="b : ${bookings}">
                <div class="booking-header">
                    <h3 class="booking-title" th:text="${b.travelPackage.title}">Package Title</h3>
                    
                    <div class="booking-customer">
                        <div class="customer-avatar" th:text="${b.fullName.substring(0, 1).toUpperCase()}">J</div>
                        <div class="customer-info">
                            <strong th:text="${b.fullName}">John Doe</strong>
                            <span th:text="${b.email}">john@example.com</span>
                        </div>
                    </div>
                </div>

                <div class="booking-details">
                    <div class="detail-item">
                        <strong>Travelers</strong>
                        <span th:text="${b.travelersCount}">2</span>
                    </div>
                    <div class="detail-item">
                        <strong>Status</strong>
                        <span class="status-badge" 
                              th:classappend="${b.status == 'PENDING'} ? 'status-badge--pending' : (${b.status == 'CONFIRMED'} ? 'status-badge--confirmed' : 'status-badge--cancelled')"
                              th:text="${b.status}">PENDING</span>
                    </div>
                </div>

                <form method="post"
                      th:action="@{/business/bookings/{id}/status(id=${b.id})}"
                      class="booking-form">
                    <div class="form-group">
                        <label for="status">Update Status</label>
                        <select name="status" id="status" class="input">
                            <option value="PENDING" th:selected="${b.status == 'PENDING'}">PENDING</option>
                            <option value="CONFIRMED" th:selected="${b.status == 'CONFIRMED'}">CONFIRMED</option>
                            <option value="CANCELLED" th:selected="${b.status == 'CANCELLED'}">CANCELLED</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn--primary">Update</button>
                </form>
            </div>
        </div>
    </div>
</main>

</body>
</html>
