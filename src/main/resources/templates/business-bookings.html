<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Package Bookings</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="fragments/business-navbar :: businessNav('bookings')"></div>

<div class="container">

    <h1>Bookings</h1>

    <div th:if="${#lists.isEmpty(bookings)}" class="muted">
        No bookings yet.
    </div>

    <div th:each="b : ${bookings}" class="card">

        <h3 th:text="${b.travelPackage.title}"></h3>

        <p>
            <b th:text="${b.fullName}"></b>
            (<span th:text="${b.email}"></span>)
        </p>

        <p>
            People:
            <span th:text="${b.travelersCount}"></span>
        </p>

        <p>Status: <strong th:text="${b.status}"></strong></p>

        <form method="post"
              th:action="@{/business/bookings/{id}/status(id=${b.id})}"
              style="display:flex; gap:10px">

            <select name="status" class="input">
                <option th:selected="${b.status == 'PENDING'}">PENDING</option>
                <option th:selected="${b.status == 'CONFIRMED'}">CONFIRMED</option>
                <option th:selected="${b.status == 'CANCELLED'}">CANCELLED</option>
            </select>

            <button class="btn btn--primary">Update</button>
        </form>

    </div>

</div>

</body>
</html>
