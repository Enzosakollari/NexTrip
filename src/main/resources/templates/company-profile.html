<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${business.companyName + ' • NextTrip'}">Company</title>
    <link rel="stylesheet" href="/css/app.css">
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
    <style>
        .company-hero {
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            margin-bottom: 28px;
        }

        .company-hero__banner {
            height: 260px;
            background: linear-gradient(135deg, rgba(0,0,0,0.25), rgba(0,0,0,0.5));
            display: flex;
            align-items: flex-end;
        }

        .company-hero__banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .company-hero__content {
            padding: 24px;
            display: grid;
            gap: 12px;
        }

        .company-hero__row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .company-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.6);
        }

        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .company-name {
            font-size: 28px;
            font-weight: 800;
        }

        .company-description {
            color: rgba(255,255,255,0.85);
            max-width: 760px;
        }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<main class="page">
    <section class="section">
        <div class="container">
            <div class="company-hero">
                <div class="company-hero__banner">
                    <img th:if="${business.bannerUrl != null}" th:src="${business.bannerUrl}" alt="Company banner">
                </div>
                <div class="company-hero__content">
                    <div class="company-hero__row">
                        <div class="company-logo">
                            <img th:if="${business.logoUrl != null}" th:src="${business.logoUrl}" alt="Company logo">
                        </div>
                        <div class="company-name" th:text="${business.companyName}">Company name</div>
                    </div>
                    <div class="company-description" th:text="${business.description}">
                        Company description goes here.
                    </div>
                </div>
            </div>

            <div class="section__head">
                <h2>Guidepacks</h2>
                <p class="muted">All travel packs from this company.</p>
            </div>

            <div class="packs" th:if="${packs != null and !packs.isEmpty()}">
                <a class="pack card" th:each="p : ${packs}" th:href="@{'/travel-packs/' + ${p.id}}">
                    <div class="pack__media">
                        <img class="pack__photo"
                             th:if="${p.thumbnailUrl != null and !#strings.isEmpty(p.thumbnailUrl)}"
                             th:src="${p.thumbnailUrl}"
                             alt="Pack photo">
                        <img class="pack__photo"
                             th:if="${(p.thumbnailUrl == null or #strings.isEmpty(p.thumbnailUrl)) and p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}"
                             th:src="${p.imageUrl}"
                             alt="Pack photo">
                        <img th:if="${p.fullyBooked}" src="/images/booked.png" alt="Fully booked" class="pack__badge">
                        <div class="pack__place" th:text="${p.destination}">Destination</div>
                    </div>

                    <div class="pack__body">
                        <div class="pack__title" th:text="${p.title}">Title</div>
                        <div class="muted pack__meta"
                             th:text="${p.durationDays + ' days - ' + p.capacity + ' seats - ' + (p.startDate != null ? p.startDate : 'TBD') + ' to ' + (p.endDate != null ? p.endDate : 'TBD') + ' - ' + p.currency + ' ' + p.price}">
                            meta
                        </div>

                        <div class="pack__foot">
                            <div class="price" th:text="${p.currency + ' ' + p.price}">EUR 0</div>
                            <span class="btn btn--small">View</span>
                        </div>
                    </div>
                </a>
            </div>

            <div th:if="${packs == null or packs.isEmpty()}" class="card card__pad">
                No travel packs yet.
            </div>
        </div>
    </section>
</main>

<script src="/js/app.js"></script>
<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>
</body>
</html>
