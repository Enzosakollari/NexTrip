<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="business-topbar" th:fragment="businessNav(active)">
    <div class="business-topbar__inner">
        <a class="business-brand" th:href="@{/business/dashboard}">
            <img class="business-brand__image" th:src="@{/images/nexttrip.png}" alt="NextTrip">
        </a>

        <nav class="business-nav__links">
            <a class="business-nav__link"
               th:classappend="${active == 'dashboard'} ? ' is-active' : ''"
               th:href="@{/business/dashboard}">
                Dashboard
            </a>

            <a class="business-nav__link"
               th:classappend="${active == 'packs'} ? ' is-active' : ''"
               th:href="@{/business/packs}">
                My Packs
            </a>

            <a class="business-nav__link"
               th:classappend="${active == 'ai'} ? ' is-active' : ''"
               th:href="@{/business/ai}">
                AI Chat
            </a>

            <a class="business-nav__link"
               th:classappend="${active == 'bookings'} ? ' is-active' : ''"
               th:href="@{/business/bookings}">
                Bookings
            </a>
        </nav>

        <div class="business-nav__right">
            <a class="business-btn business-btn--primary" th:href="@{/business/packs/new}">
                <span>+</span>
                <span>Create Pack</span>
            </a>
        </div>
    </div>
</header>

<style th:fragment="businessNavbarStyles">
    .business-topbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(11, 19, 36, 0.92);
        backdrop-filter: blur(22px) saturate(160%);
        border-bottom: 1px solid rgba(251, 191, 36, 0.2);
        box-shadow: 0 18px 45px rgba(2, 6, 23, 0.6);
    }

    .business-topbar::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: linear-gradient(90deg, #fbbf24, #f59e0b);
        opacity: 0.7;
    }

    .business-topbar__inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 2rem;
    }

    .business-brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        color: var(--light);
        font-weight: 800;
        font-size: 1.5rem;
        transition: transform 0.2s ease;
    }

    .business-brand:hover {
        transform: scale(1.05);
    }

    .business-brand__logo {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fbbf24;
        font-weight: 900;
        font-size: 1.25rem;
        border: 1px solid rgba(251, 191, 36, 0.4);
        box-shadow: 0 6px 18px rgba(2, 6, 23, 0.5);
    }

    .business-brand__image {
        height: 44px;
        width: auto;
        display: block;
    }

    .business-nav__links {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .business-nav__link {
        padding: 0.625rem 1.25rem;
        text-decoration: none;
        color: var(--light);
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }

    .business-nav__link:hover {
        color: #fbbf24;
        background: rgba(19, 35, 71, 0.8);
    }

    .business-nav__link.is-active {
        color: #fbbf24;
        background: rgba(19, 35, 71, 0.85);
        font-weight: 700;
    }

    .business-nav__link.is-active::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 3px;
        background: linear-gradient(90deg, #fbbf24, #f59e0b);
        border-radius: 2px;
    }

    .business-nav__right {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .business-btn {
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(251, 191, 36, 0.35);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.95rem;
        background: rgba(11, 19, 36, 0.85);
        color: var(--light);
    }

    .business-btn--primary {
        background: linear-gradient(135deg, #0b2f6d, #0f1b34);
        color: #fbbf24;
        border: 1px solid rgba(251, 191, 36, 0.45);
        box-shadow: 0 10px 28px rgba(2, 6, 23, 0.55);
    }

    .business-btn--primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(251, 191, 36, 0.25);
    }

    @media (max-width: 968px) {
        .business-nav__links {
            display: none;
        }
    }
</style>

</body>
</html>
