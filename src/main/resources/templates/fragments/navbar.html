<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Navbar</title>
</head>
<body>
    <!-- Navbar Styles -->
    <div th:fragment="navbarStyles">
        <style>
            /* Topbar */
            .topbar {
                top: 0;
                z-index: 1000;
                background: rgba(11, 19, 36, 0.92);
                backdrop-filter: blur(22px) saturate(160%);
                border-bottom: 1px solid rgba(251, 191, 36, 0.2);
                box-shadow: 0 18px 45px rgba(2, 6, 23, 0.6);
                position: sticky;
            }

            .topbar::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 3px;
                background: linear-gradient(90deg, #fbbf24, #f59e0b);
                opacity: 0.7;
            }

            .topbar__inner {
                max-width: 1400px;
                margin: 0 auto;
                padding: 1.25rem 3rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                font-weight: 900;
                font-size: 1.75rem;
                color: var(--light);
                text-decoration: none;
                transition: transform 0.3s ease;
            }

            .brand__logo {
                height: 44px;
                width: auto;
                display: block;
            }

            .brand:hover {
                transform: scale(1.05);
            }

            .brand__mark {
                width: 48px;
                height: 48px;
                background: linear-gradient(135deg, var(--primary), var(--primary-dark));
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fbbf24;
                font-weight: 900;
                font-size: 1.25rem;
                border: 1px solid rgba(251, 191, 36, 0.4);
                box-shadow: 0 6px 20px rgba(2, 6, 23, 0.5);
            }

            .nav {
                display: flex;
                gap: 2.5rem;
                align-items: center;
            }

            .nav__link {
                color: var(--light);
                text-decoration: none;
                font-weight: 600;
                font-size: 0.95rem;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                padding: 0.5rem 0;
            }

            .nav__link:hover {
                color: #fbbf24;
            }

            .nav__link::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                width: 0;
                height: 3px;
                background: linear-gradient(90deg, #fbbf24, #f59e0b);
                border-radius: 2px;
                transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav__link:hover::after {
                width: 100%;
            }

            .topbar__actions {
                display: flex;
                gap: 1rem;
            }

            .btn {
                padding: 0.875rem 2rem;
                border-radius: 14px;
                font-weight: 600;
                font-size: 0.95rem;
                text-decoration: none;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                border: 1px solid rgba(251, 191, 36, 0.35);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                position: relative;
                overflow: hidden;
                background: rgba(11, 19, 36, 0.85);
                color: var(--light);
            }

            .btn--ghost {
                background: rgba(11, 19, 36, 0.6);
                color: #fbbf24;
                border: 1px solid rgba(251, 191, 36, 0.35);
            }

            .btn--ghost:hover {
                background: rgba(19, 35, 71, 0.9);
                border-color: rgba(251, 191, 36, 0.6);
                transform: translateY(-2px);
                box-shadow: 0 10px 26px rgba(251, 191, 36, 0.2);
            }

            .btn--primary {
                background: linear-gradient(135deg, #0b2f6d, #0f1b34);
                color: #fbbf24;
                border: 1px solid rgba(251, 191, 36, 0.45);
                box-shadow: 0 10px 28px rgba(2, 6, 23, 0.55);
            }

            .btn--primary:hover {
                transform: translateY(-3px);
                box-shadow: 0 14px 34px rgba(251, 191, 36, 0.25);
            }

            @media (max-width: 968px) {
                .nav {
                    display: none;
                }
            }
        </style>
    </div>

    <!-- Navbar -->
    <header th:fragment="navbar" class="topbar">
        <div class="topbar__inner">
            <a th:href="@{/index}" class="brand">
                <img class="brand__logo" th:src="@{/images/nexttrip.png}" alt="NextTrip">
            </a>

            <nav class="nav">
                <a th:href="@{/index}" class="nav__link">Explore</a>
                <a th:href="@{/flights/search-view}" class="nav__link">Flight Search</a>
                <a th:href="@{/timetable}" class="nav__link">Timetable</a>
                <a th:href="@{/travel-packs}" class="nav__link">Travel Packs</a>
            </nav>

            <div class="topbar__actions">
                <a class="btn btn--ghost" th:href="@{/chat}">Ask AI</a>
                <a class="btn btn--primary" sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
                <a class="btn btn--primary" sec:authorize="isAuthenticated()" th:href="@{/my-bookings}">My Bookings</a>
                <a class="btn btn--primary" sec:authorize="isAuthenticated()" th:href="@{/my-tickets}">My Tickets</a>
            </div>
        </div>
    </header>
</body>
</html>
