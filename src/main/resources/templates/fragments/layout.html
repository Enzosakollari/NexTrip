<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">NextTrip</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<!-- NAVBAR -->
<header class="topbar">
    <div class="container topbar__inner">
        <a href="/" class="brand">
            <span class="brand__mark">NT</span>
            <span class="brand__name">NextTrip</span>
        </a>

        <nav class="nav">
            <a href="/" class="nav__link">Explore</a>
            <a href="/flights-search" class="nav__link">Flight Search</a>
            <a href="/travel-packs" class="nav__link">Travel Packs</a>
            <a href="/chat" class="nav__link">AI Chat</a>
            <a href="/contact" class="nav__link">Contact</a>
        </nav>

        <div class="topbar__actions">
            <a class="btn btn--ghost" href="/login">Login</a>
            <a class="btn btn--primary" href="/travel-packs">Search Trips</a>
        </div>
    </div>
</header>

<!-- PAGE CONTENT -->
<main class="page" th:fragment="page(content)">
    <div th:replace="${content}"></div>
</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>

<script src="/js/app.js"></script>
</body>
</html>
