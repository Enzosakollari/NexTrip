<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">NextTrip</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <div th:replace="~{fragments/navbar :: navbarStyles}"></div>
</head>

<body>
<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- PAGE CONTENT -->
<main class="page" th:fragment="page(content)">
    <div th:replace="${content}"></div>
</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">Â© 2025 NextTrip</div>
    </div>
</footer>

<script src="/js/app.js"></script>
</body>
</html>
