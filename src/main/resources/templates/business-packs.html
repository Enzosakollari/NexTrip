<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Packs - NextTrip Business</title>
  <link rel="stylesheet" href="/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <div th:replace="~{fragments/business-navbar :: businessNavbarStyles}"></div>
</head>
<body>

<div th:replace="~{fragments/business-navbar :: businessNav('packs')}"></div>

<main class="page">
  <section class="section">
    <div class="container">

      <div class="section__head section__head--row">
        <div>
          <h1>My Travel Packs</h1>
          <p class="muted">Create, update and delete your packages.</p>
        </div>

        <a class="btn btn--primary" th:href="@{/business/packs/new}">
          New Pack
        </a>
      </div>

      <div class="list" th:if="${packs != null and !packs.isEmpty()}">
        <div class="result" th:each="p : ${packs}">
          <div class="result__left">
            <div class="badge">📦</div>
            <div>
              <div style="font-weight:900;" th:text="${p.title}">Pack title</div>
              <div class="muted" style="font-size:13px;">
                <span th:text="${p.destination}">Destination</span>
                • <span th:text="${p.durationDays}">0</span> days
                • <span th:text="${p.price}">0</span> <span th:text="${p.currency}">EUR</span>
              </div>
            </div>
          </div>

          <div class="row-actions">
            <a class="btn btn--small"
               th:href="@{/business/packs/{packId}/edit(packId=${p.id})}">
              Edit
            </a>

            <button class="btn btn--small btn--danger"
                    type="button"
                    th:attr="data-delete-url=@{/business/packs/{packId}/delete(packId=${p.id})}"
                    onclick="openDeleteModal(this)">
              Delete
            </button>
          </div>
        </div>
      </div>

      <div class="card card__pad" th:if="${packs == null or packs.isEmpty()}">
        <div class="section__title">No packs yet</div>
        <p class="muted">Create your first travel pack.</p>
        <a class="btn btn--primary" th:href="@{/business/packs/new}">+ Add travel pack</a>
      </div>

    </div>
  </section>
</main>

<div class="modal" id="deleteModal" aria-hidden="true">
  <div class="modal__backdrop" onclick="closeDeleteModal()"></div>
  <div class="modal__card">
    <div class="modal__title">Delete pack?</div>
    <div class="muted">This action can’t be undone.</div>

    <form id="deleteForm" method="post" style="margin-top:14px; display:flex; gap:10px; justify-content:flex-end;">
      <button type="button" class="btn btn--ghost" onclick="closeDeleteModal()">Cancel</button>
      <button type="submit" class="btn btn--primary btn--danger">Delete</button>
    </form>
  </div>
</div>

<script>
  function openDeleteModal(btn) {
    const url = btn.getAttribute("data-delete-url");
    document.getElementById("deleteForm").setAttribute("action", url);
    const modal = document.getElementById("deleteModal");
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
  }
  function closeDeleteModal() {
    const modal = document.getElementById("deleteModal");
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
  }
</script>

<footer class="footer">
    <div class="container footer__inner">
        <div>
            <strong>NextTrip</strong>
            <p class="muted">Travel beyond the map.</p>
        </div>
        <div class="muted">© 2025 NextTrip</div>
    </div>
</footer>
</body>
</html>
