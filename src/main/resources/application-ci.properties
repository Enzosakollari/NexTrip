spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/nextrip}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

amadeus.api.base-url=${AMADEUS_API_BASE_URL:https://test.api.amadeus.com}
amadeus.api.key=${AMADEUS_API_KEY:}
amadeus.api.secret=${AMADEUS_API_SECRET:}

huggingface.router.base-url=${HF_BASE_URL:https://router.huggingface.co/v1}
huggingface.router.model=${HF_MODEL:meta-llama/Llama-3.1-8B-Instruct}
huggingface.api.key=${HF_TOKEN:}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/booking-success?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/booking-cancel}
stripe.flight-success-url=${STRIPE_FLIGHT_SUCCESS_URL:http://localhost:8080/flights/checkout-success?session_id={CHECKOUT_SESSION_ID}}
stripe.flight-cancel-url=${STRIPE_FLIGHT_CANCEL_URL:http://localhost:8080/flights/checkout-cancel}
stripe.currency=${STRIPE_CURRENCY:eur}
