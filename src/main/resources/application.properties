spring.profiles.active=local

# database (non-secret parts ok)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nextrip}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_APP_PASSWORD:}

# amadeus
amadeus.api.base-url=https://test.api.amadeus.com
amadeus.api.key=${AMADEUS_API_KEY:}
amadeus.api.secret=${AMADEUS_API_SECRET:}

# huggingface
huggingface.router.base-url=https://router.huggingface.co/v1
huggingface.router.model=meta-llama/Llama-3.1-8B-Instruct
huggingface.api.key=${HF_TOKEN:}

# Thymeleaf - disable cache in development
spring.thymeleaf.cache=false

# Stripe (set secrets via environment)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/booking-success?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/booking-cancel}
stripe.flight-success-url=${STRIPE_FLIGHT_SUCCESS_URL:http://localhost:8080/flights/checkout-success?session_id={CHECKOUT_SESSION_ID}}
stripe.flight-cancel-url=${STRIPE_FLIGHT_CANCEL_URL:http://localhost:8080/flights/checkout-cancel}
stripe.currency=${STRIPE_CURRENCY:eur}

# redis (optional cache for flight search)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
flights.cache.ttl-minutes=${FLIGHT_CACHE_TTL_MINUTES:30}
flights.store-to-db=${FLIGHT_STORE_TO_DB:false}

# kafka (optional event pipeline)
kafka.enabled=${KAFKA_ENABLED:true}
kafka.topics.booking-events=${KAFKA_BOOKING_EVENTS_TOPIC:booking.events}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:nextrip-booking}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
